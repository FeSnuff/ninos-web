# Builds the site and publishes it to GitHub Pages on every push to main.
# Pull requests only build (to catch errors) and never publish.
name: Build & deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: the build can only read the repo; only the deploy job can publish.
permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  # PRs: cancel older runs. main: never cancel a deploy halfway.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      # Exact versions from package-lock.json (reproducible, no surprise updates).
      # Run `npm install` once on your computer and commit package-lock.json.
      - name: Install dependencies
        run: |
          if [ ! -f package-lock.json ]; then
            echo "::error::package-lock.json is missing. Run 'npm install' on your computer and commit package-lock.json."
            exit 1
          fi
          npm ci --no-fund

      - name: Security audit (production dependencies)
        run: npm audit --omit=dev --audit-level=high

      # Informational for now; make it blocking once `npm run check` passes locally.
      - name: Type check
        run: npm run check
        continue-on-error: true

      - name: Read GitHub Pages settings (domain / base path)
        id: pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6

      - name: Build
        run: npm run build
        env:
          SITE_URL: ${{ steps.pages.outputs.origin || 'https://example.github.io' }}
          BASE_PATH: ${{ steps.pages.outputs.base_path || '/' }}
          # Optional: set in Settings → Secrets and variables → Actions → Variables
          WEB3FORMS_KEY: ${{ vars.WEB3FORMS_KEY }}

      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
